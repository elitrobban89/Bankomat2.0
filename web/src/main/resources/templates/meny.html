<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Meny')}"></head>
<!-- Talen lases av splash.js till kontoraden. th:attr utan varde ger inget attribut alls,
     sa saknas siffrorna visar splashen raden utan dem i stallet for med en nolla. -->
<body th:attr="data-konton=${antalKonton},data-kunder=${antalKunder},data-db=${databas},data-boot=${springBoot},data-java=${javaVersion}">
<div class="atm-machine">
  <div th:replace="~{fragments :: atm-top}"></div>
  <div class="atm-mid">
    <div th:replace="~{fragments :: atm-side-left}"></div>
    <div class="atm-screen">
      <div th:replace="~{fragments :: screen-bar('VÄLKOMMEN')}"></div>
      <div class="screen-main">
        <div class="screen-welcome">
          <h2>Välj tjänst</h2>
          <p>Tryck på önskat alternativ</p>
        </div>
        <a class="menu-btn" th:href="@{/registervard}">Registervård</a>
        <a class="menu-btn" th:href="@{/kontohantering}">Kontohantering</a>
        <a class="menu-btn secondary" th:href="@{/kontoversikt}">Kontoöversikt</a>

        <!-- Kortremsan: det maskinen visar INNAN ett kort ar isatt. Ikonen ar ett kort med
             chip, ritat i samma grona fosfor som resten av skarmen. Markena ar textsatta i
             maskinens egen skrift och inte inklistrade logotyper - varumarken tillhor nagon
             annan, och en gronmonokrom CRT hade anda inte visat dem i sina farger. -->
        <div class="card-accept">
          <div class="card-accept-vanster">
            <svg class="kort-glas" width="30" height="21" viewBox="0 0 30 21" aria-hidden="true">
              <rect x=".8" y=".8" width="28.4" height="19.4" rx="2.6" fill="rgba(0,255,127,.09)"
                    stroke="#00ff7f" stroke-width="1.1"/>
              <rect x="3.4" y="6.2" width="6.4" height="5" rx="1" fill="rgba(0,255,127,.55)"/>
              <path d="M3.4 8.7h6.4M6.6 6.2v5" stroke="#021c0c" stroke-width=".7"/>
              <path d="M13.5 7.5h13M13.5 11h9" stroke="rgba(0,255,127,.65)" stroke-width="1.1"
                    stroke-linecap="round"/>
              <path d="M3.4 15.4h23.2" stroke="rgba(0,255,127,.3)" stroke-width="1.6"/>
            </svg>
            <span>
              <b>Sätt in ditt kort</b>
              <i>Please insert your card · chip uppåt</i>
            </span>
          </div>
          <!-- Kortmarken som SMA IKONER, ritade har i SVG. Det ar handritade
               efterliknelser och inte de officiella markesfilerna: formerna (tva
               overlappande ringar, blatt band med gul kant) ar vad man kanner igen pa
               en kortlist, men logotyperna tillhor sina agare. Ska bankomaten nagon
               gang bli mer an en demo ar det HAR de riktiga, licensierade
               acceptansmarkena ska in. Listen ar ljus som pa en riktig Bankomat -
               marken ar gjorda for ljus botten och forsvinner mot gron fosfor. -->
          <div class="card-marks" aria-label="Kort som tas emot">
            <svg class="kortmarke" viewBox="0 0 34 22" width="34" height="22" role="img" aria-label="Visa">
              <rect width="34" height="22" rx="3" fill="#f4f6fb"/>
              <text x="17" y="14.6" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif"
                    font-size="9" font-weight="700" font-style="italic" fill="#1a1f71"
                    letter-spacing=".4">VISA</text>
              <rect x="6" y="16.4" width="22" height="1.6" rx=".8" fill="#f7b600"/>
            </svg>
            <svg class="kortmarke" viewBox="0 0 34 22" width="34" height="22" role="img" aria-label="Mastercard">
              <rect width="34" height="22" rx="3" fill="#f4f6fb"/>
              <circle cx="14" cy="11" r="6.4" fill="#eb001b"/>
              <circle cx="20" cy="11" r="6.4" fill="#f79e1b" fill-opacity=".92"/>
              <path d="M17 6.1a6.4 6.4 0 0 0 0 9.8 6.4 6.4 0 0 0 0-9.8z" fill="#ff5f00"/>
            </svg>
            <svg class="kortmarke" viewBox="0 0 34 22" width="34" height="22" role="img" aria-label="Maestro">
              <rect width="34" height="22" rx="3" fill="#f4f6fb"/>
              <circle cx="14" cy="11" r="6.4" fill="#0099df"/>
              <circle cx="20" cy="11" r="6.4" fill="#ed0006" fill-opacity=".92"/>
              <path d="M17 6.1a6.4 6.4 0 0 0 0 9.8 6.4 6.4 0 0 0 0-9.8z" fill="#6c2c2f"/>
            </svg>
          </div>
        </div>
      </div>
    </div>
    <div th:replace="~{fragments :: atm-side-right}"></div>
  </div>
  <div th:replace="~{fragments :: atm-bottom}"></div>
</div>
</body>
</html>
